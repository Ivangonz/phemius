[project]
name = "phemius"
version = "0.1.0"
description = "Hear your docs: turn documentation into narrated audio."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "structlog>=24.4",
    "watchdog>=5.0",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "openai>=1.50",
]

[project.optional-dependencies]
kokoro = [
    "kokoro>=0.9",
    "soundfile>=0.12",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The built UI in src/phemius/static is ignored by git, so hatchling would skip
# it. Listing it as an artifact ships it in both the sdist and the wheel. Build
# the UI (`make build`) before `uv build`; CI does both.
[tool.hatch.build]
artifacts = ["src/phemius/static"]

[tool.hatch.build.targets.wheel]
packages = ["src/phemius"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# The kokoro extra is optional and not installed in dev or CI; kokoro and
# soundfile ship no type information.
[[tool.mypy.overrides]]
module = ["kokoro", "kokoro.*", "soundfile", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
