[project]
name = "phemius"
dynamic = ["version"]
description = "Hear your docs: turn documentation into narrated audio."
readme = "README.md"
# Kokoro supports only Python 3.10 to 3.12 (see CLAUDE.md before changing this).
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ivan Gonzalez" }]
keywords = ["text-to-speech", "tts", "documentation", "audio", "self-hosted", "kokoro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "structlog>=24.4",
    "watchdog>=5.0",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "openai>=1.50",
    "httpx2>=2.16",
]

[project.urls]
Homepage = "https://github.com/Ivangonz/phemius"
Documentation = "https://github.com/Ivangonz/phemius#readme"
Source = "https://github.com/Ivangonz/phemius"
Issues = "https://github.com/Ivangonz/phemius/issues"

[project.scripts]
phemius = "phemius.cli:main"

[project.optional-dependencies]
kokoro = [
    "kokoro>=0.9",
    "soundfile>=0.12",
    "numpy>=1.26",
    # Listed so [tool.uv.sources] can choose its wheels; Kokoro already needs it.
    "torch>=2.4",
]
# GPL-3.0-or-later, so never a default dependency (see ADR-003).
piper = [
    "piper-tts>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

# On Linux, PyTorch comes from its CPU-only index: PyPI's Linux wheels pull
# gigabytes of CUDA libraries that Kokoro never uses. macOS keeps PyPI's wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
# 1.27 reads the SPDX `license` expression and `license-files` (PEP 639).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The built UI in src/phemius/static is ignored by git, so hatchling would skip
# it. Listing it as an artifact ships it in both the sdist and the wheel. Build
# the UI (`make build`) before `uv build`; CI does both.
[tool.hatch.build]
artifacts = ["src/phemius/static"]

# `phemius.__version__` is the one place the version is written.
[tool.hatch.version]
path = "src/phemius/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/phemius"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# The piper extra is optional and not installed in dev or CI.
[[tool.mypy.overrides]]
module = ["piper", "piper.*"]
ignore_missing_imports = true

# The kokoro extra is optional and not installed in dev or CI; kokoro and
# soundfile ship no type information.
[[tool.mypy.overrides]]
module = ["kokoro", "kokoro.*", "soundfile", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live_model: calls a real script model; skipped unless PHEMIUS_EVAL_LIVE=1",
]
