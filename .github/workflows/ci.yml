name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.4"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No Kokoro extra: tests use the stub voice and a fake script model, so CI
      # needs no API keys, model downloads or ffmpeg.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff (lint)
        run: uv run ruff check .

      - name: Run ruff (format check)
        run: uv run ruff format --check .

      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ hashFiles('src/**/*.py', 'tests/**/*.py', 'pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            mypy-${{ runner.os }}-

      - name: Run mypy
        run: uv run mypy

      - name: Run pytest
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.4"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      # The UI's API types are generated from the FastAPI schema, so a diff here
      # means the API changed without `make api-types` being run.
      - name: Check API types are up to date
        working-directory: .
        run: |
          uv sync --locked
          make api-types
          git diff --exit-code frontend/openapi.json frontend/src/lib/api-schema.d.ts \
            || { echo "::error::API types are stale. Run 'make api-types' and commit the result."; exit 1; }

      - name: Run Prettier (format check)
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run tsc (typecheck)
        run: npm run typecheck

      - name: Run Vitest
        run: npm test

      - name: Build
        run: npm run build

  # Builds the sdist and wheel as a release would, then proves the `phemius`
  # command serves the UI from a clean virtualenv with no Node, as
  # `uv tool install` would.
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.4"
          enable-cache: true

      - name: Build the UI into src/phemius/static
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build the sdist and wheel
        run: uv build --python 3.12

      - name: Check the built UI is in the sdist and wheel
        run: |
          unzip -l dist/phemius-*.whl | grep -q ' phemius/static/index.html$' \
            || { echo "::error::The wheel is missing phemius/static/index.html"; exit 1; }
          tar -tzf dist/phemius-*.tar.gz | grep -q '/src/phemius/static/index.html$' \
            || { echo "::error::The sdist is missing src/phemius/static/index.html"; exit 1; }

      - name: Install the wheel in a clean virtualenv
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/phemius-*.whl

      # PATH holds only the virtualenv and system binaries, so Node is out of
      # reach even though the runner has it installed. It is set in the script
      # because the runner prepends setup-node's folder to a step's `env` PATH.
      - name: Serve the UI and API from the installed wheel without Node
        working-directory: ${{ runner.temp }}
        env:
          PHEMIUS_TTS: stub
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:/usr/bin:/bin"
          if command -v node; then echo "::error::Node is on PATH"; exit 1; fi
          phemius --version
          phemius serve --port 8000 --data-dir "$RUNNER_TEMP/phemius-data" > server.log 2>&1 &
          for attempt in $(seq 30); do
            curl -fsS http://127.0.0.1:8000/api/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8000/settings | grep -q '<div id="root">'

      - name: Show the server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

  # Builds the small image (no Kokoro, no ffmpeg) for speed, then proves the
  # container is healthy, serves the UI and API, has no Node and is not root.
  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: phemius:ci
          build-args: |
            WITH_KOKORO=false
            WITH_FFMPEG=false
          cache-from: type=gha,scope=docker-slim
          cache-to: type=gha,mode=max,scope=docker-slim

      - name: Check the image has no Node and does not run as root
        run: |
          docker run --rm --entrypoint sh phemius:ci -c '! command -v node' \
            || { echo "::error::Node is in the image"; exit 1; }
          uid=$(docker run --rm --entrypoint id phemius:ci -u)
          [ "$uid" != "0" ] || { echo "::error::The image runs as root"; exit 1; }

      - name: Start the container and wait for its health check
        run: |
          docker run -d --name phemius -p 8000:8000 -e PHEMIUS_TTS=stub phemius:ci
          for attempt in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' phemius)
            [ "$status" = "starting" ] || break
            sleep 1
          done
          [ "$status" = "healthy" ] || { echo "::error::The container is $status"; exit 1; }

      - name: Serve the UI and API from the container
        run: |
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          # Network mode: the API needs the token printed on the first start.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/docs)
          [ "$code" = "401" ] || { echo "::error::The API answered $code without a token"; exit 1; }
          token=$(docker logs phemius 2>&1 | grep -o 'phm_[A-Za-z0-9_-]*' | head -n 1)
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8000/api/docs > /dev/null

      - name: Show the container log
        if: failure()
        run: docker logs phemius || true
