name: Publish image

# Publishes the Docker image to GitHub Container Registry for each release tag:
# ghcr.io/<owner>/phemius:<version> and :latest with Kokoro and ffmpeg, and
# :<version>-slim and :slim without them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.variant.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        variant:
          - name: default
            suffix: ""
            with_kokoro: "true"
            with_ffmpeg: "true"
          - name: slim
            suffix: "-slim"
            with_kokoro: "false"
            with_ffmpeg: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names must be lowercase; the owner is not.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/phemius" >> "$GITHUB_OUTPUT"

      # Only a final release tag (vX.Y.Z) moves `latest` and `slim`; a
      # pre-release such as v0.1.0a1 gets only its own version tag.
      - name: Release kind
        id: release
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_final=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_final=false" >> "$GITHUB_OUTPUT"
          fi

      # Versions follow PEP 440 (0.1.0a1), like the Python package, not SemVer.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
            suffix=${{ matrix.variant.suffix }}
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}},enable=${{ steps.release.outputs.is_final }}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ matrix.variant.name == 'default' && steps.release.outputs.is_final == 'true' }}
            type=raw,value=slim,suffix=,enable=${{ matrix.variant.name == 'slim' && steps.release.outputs.is_final == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WITH_KOKORO=${{ matrix.variant.with_kokoro }}
            WITH_FFMPEG=${{ matrix.variant.with_ffmpeg }}
          cache-from: type=gha,scope=publish-${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.variant.name }}
